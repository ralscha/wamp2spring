version: '3'

vars:
  MVNW: '{{if eq OS "windows"}}cmd /c mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all

  clean:
    cmds:
      - '{{.MVNW}} clean'

  test:
    cmds:
      - '{{.MVNW}} test'

  verify:
    cmds:
      - '{{.MVNW}} verify'

  ci:
    cmds:
      - '{{.MVNW}} clean verify'

  format:
    cmds:
      - '{{.MVNW}} spring-javaformat:apply'

  sortpom:
    cmds:
      - '{{.MVNW}} sortpom:sort'

  license:
    cmds:
      - '{{.MVNW}} license:format'
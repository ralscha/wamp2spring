name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
       matrix:
         java: [17, 21, 25, 26]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Maven Verify
      run: ./mvnw --batch-mode --no-transfer-progress clean verify
